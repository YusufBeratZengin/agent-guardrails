name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.x, 22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint, typecheck and tests with coverage
        run: npm run check
      - run: npm run scan
      - name: Core evaluation budget
        if: matrix.os == 'ubuntu-latest'
        run: npm run bench -- --core-only
      - run: npm pack --dry-run --ignore-scripts
