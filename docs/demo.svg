<svg xmlns="http://www.w3.org/2000/svg" width="1169" height="603" viewBox="0 0 1169 603" role="img" aria-labelledby="title desc">
  <title id="title">agent-guardrails asks before git push</title>
  <desc id="desc">Real CLI output from the first case of node examples/demo.mjs. The outbound rule requests human confirmation, with a redacted preview. Remaining demo cases are omitted. Inspected commands are never executed.</desc>
  <rect x="1" y="1" width="1167" height="601" rx="16" fill="#0d1117" stroke="#30363d"/>
  <path d="M17 1h1135a16 16 0 0 1 16 16v33H1V17A16 16 0 0 1 17 1Z" fill="#161b22"/>
  <g>
    <circle cx="25" cy="25" r="6" fill="#ff5f57"/>
    <circle cx="45" cy="25" r="6" fill="#febc2e"/>
    <circle cx="65" cy="25" r="6" fill="#28c840"/>
  </g>
  <text x="584.5" y="30" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="13">agent-guardrails · local policy evaluation</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" xml:space="preserve">
    <text x="32" y="88" fill="#a5b4fc">$ node examples/demo.mjs</text>
    <text x="32" y="111" fill="#d1d5db">git push</text>
    <text x="32" y="134" fill="#d1d5db">{</text>
    <text x="32" y="157" fill="#fbbf24">  &quot;decision&quot;: &quot;ask&quot;,</text>
    <text x="32" y="180" fill="#d1d5db">  &quot;findings&quot;: [</text>
    <text x="32" y="203" fill="#d1d5db">    {</text>
    <text x="32" y="226" fill="#d1d5db">      &quot;ruleId&quot;: &quot;outbound&quot;,</text>
    <text x="32" y="249" fill="#d1d5db">      &quot;code&quot;: &quot;human-confirmation&quot;,</text>
    <text x="32" y="272" fill="#d1d5db">      &quot;message&quot;: &quot;Outbound action requires human confirmation for this invocation.&quot;,</text>
    <text x="32" y="295" fill="#d1d5db">      &quot;preview&quot;: &quot;[REDACTED]&quot;,</text>
    <text x="32" y="318" fill="#fbbf24">      &quot;mode&quot;: &quot;ask&quot;</text>
    <text x="32" y="341" fill="#d1d5db">    }</text>
    <text x="32" y="364" fill="#d1d5db">  ],</text>
    <text x="32" y="387" fill="#d1d5db">  &quot;output&quot;: {</text>
    <text x="32" y="410" fill="#d1d5db">    &quot;hookSpecificOutput&quot;: {</text>
    <text x="32" y="433" fill="#d1d5db">      &quot;hookEventName&quot;: &quot;PreToolUse&quot;,</text>
    <text x="32" y="456" fill="#fbbf24">      &quot;permissionDecision&quot;: &quot;ask&quot;,</text>
    <text x="32" y="479" fill="#d1d5db">      &quot;permissionDecisionReason&quot;: &quot;[outbound:human-confirmation] Outbound action requires human confirmation for this invocation.&quot;</text>
    <text x="32" y="502" fill="#d1d5db">    }</text>
    <text x="32" y="525" fill="#d1d5db">  }</text>
    <text x="32" y="548" fill="#d1d5db">}</text>
  </g>
  <text x="32" y="586" fill="#8b949e" font-family="monospace" font-size="12">First case shown · remaining cases omitted · inspected commands never run</text>
</svg>
